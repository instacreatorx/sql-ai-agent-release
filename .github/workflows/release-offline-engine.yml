name: Production Air-Gapped Release Packager

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Build Metadata
        id: meta
        run: |
          CLEAN_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${CLEAN_REPO}" >> $GITHUB_OUTPUT
          echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Image Archive for Air-Gapped Use
        run: |
          echo "==> Pulling generated image back to runner context..."
          docker pull ghcr.io/love-solana/sqlm:${{ steps.meta.outputs.version }}
          
          echo "==> Bundling image layer configurations..."
          docker save ghcr.io/love-solana/sqlm:${{ steps.meta.outputs.version }} -o app-image.tar
          
          echo "==> Packaging archive and deploy script into zip layer..."
          zip -9 app-delivery-${{ steps.meta.outputs.version }}.zip app-image.tar

      - name: Create Production GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-delivery-${{ steps.meta.outputs.version }}.zip
            deploy-offline.sh
          name: Production Release ${{ steps.meta.outputs.version }}
          body: "Automated distribution payload for air-gapped system deployment."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
